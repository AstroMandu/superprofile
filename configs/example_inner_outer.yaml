# Example: optical inner- and outer-region fits.
# From pipeline/: python3 pipe_superprofile.py --config ../configs/example_inner_outer.yaml
preset: viva-test

# Input layout: <data_dir>/<galaxy>/cube.fits (and hermite.npy).
data_dir: /home/mskim/workspace/research/data/MFS/MFS_66arcsec
# Optional subset; omit to process every galaxy under data_dir.
# galaxies: [VCC307]

# Results: <data_dir>/<galaxy>/NGFIT/example_inner_outer_2GFIT_HERMOM/
# output_dir_name: example_inner_outer_2GFIT_HERMOM
output_dir: /home/mskim/workspace/research/data/MFS/MFS_66arcsec_2GFIT_HERMOM  # null: per-galaxy output; a path: shared output override.

workers: 60
progress: terminal
overwrite: false

fit:
  correlation_diagnostics: false  # true: robust pairwise Spearman diagnostics.
  intermediate_plots: false  # Keep final/error plots; skip intermediate atlases.
  walk_plot_max_steps: 1000  # Display only; fitting samples are unchanged.
  walk_plot_max_walkers: 30
  mode: HERMOM
  model: 2GFIT
  resamples: 5000
  guess_from_whole: false  # Set true to initialize from saved whole-region fits.

masks:
  cleanup_after_run: true  # true: delete used masks after success; false: keep masks.
  regions: [whole, angle]
  catalog: /home/mskim/workspace/research/data/catalog/diameters_NEDLVS.csv
  angle_radial_regions: [inner, outer]
  multipliers: [1.0]
  angles: {start: 0, stop: 360, step: 15}  # Equivalent to np.arange(0, 360, 15)
  angle_widths: [120]